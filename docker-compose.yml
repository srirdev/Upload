# Local development normally uses the PostgreSQL already installed on this machine (see README), so start only:
#   docker compose up -d redis minio
# The postgres service is for machines without a local PostgreSQL (it would clash with a local server on 5432).
services:
  postgres:
    image: postgres:16
    profiles: ["postgres"]  # opt-in: docker compose --profile postgres up -d
    environment:
      POSTGRES_USER: upload_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: upload_db
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upload_user -d upload_db"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Run the API and worker on the host during development (see README).
  # Uncomment to run the worker in Docker (arq works best on Linux):
  # worker:
  #   image: python:3.12
  #   working_dir: /app/backend
  #   volumes: [.:/app]
  #   env_file: .env
  #   command: sh -c "pip install -r requirements.txt && arq app.workers.settings.WorkerSettings"

volumes:
  pgdata:
  miniodata:
